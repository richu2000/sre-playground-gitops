apiVersion: apps/v1
kind: Deployment

metadata:
  name: sre-playground

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sre-playground

  template:

    metadata:
      labels:
        app: sre-playground

    spec:

      containers:

      - name: fastapi

        image: ghcr.io/<github-username>/<repo>:latest  
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
